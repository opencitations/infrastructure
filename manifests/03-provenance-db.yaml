apiVersion: v1
kind: Service
metadata:
  name: oc-prov-service
  namespace: default
  labels:
    app: oc-prov
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: oc-prov-service-1
  namespace: default
  labels:
    kubernetes.io/service-name: oc-prov-service
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: http
    port: ${PROV_ENDPOINT_PORT}
    protocol: TCP
endpoints:
  - addresses:
      - "${PROV_ENDPOINT_IP}"
    conditions:
      ready: true